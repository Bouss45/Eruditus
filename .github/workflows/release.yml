name: release

# Publication de l'app (spec/publication.md § 2, D48) : à chaque push sur main qui touche l'app,
# tests JVM, APK release signé, puis Release GitHub v1.0.<numéro du run>, suivie par Obtainium.
# La CI ne déploie jamais server/ : deploy.sh est lancé par le mainteneur, avant le merge (D51).
on:
  push:
    branches: [main]
    # Ce qui touche l'app (D49) : même liste, dans le même ordre, que NotesDeVersion.MOTIFS_APP
    # (android-app/release-notes), vérifié par WorkflowReleaseTest.
    paths:
      - "android-app/**"
      - "!android-app/**/*.md"
      - "!android-app/release-notes/**"
      - "!android-app/**/src/test*/**"
      - "!android-app/**/src/androidTest*/**"
      - "!android-app/**/src/catalogue/**"
      - "!android-app/**/src/debug/**"
      - "!android-app/**/src/preview/**"

permissions:
  contents: read

# Une Release à la fois, dans l'ordre des push ; jamais annulée en cours.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tests, APK signé, Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # création de la Release
    env:
      NUMERO: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      TAG: v1.0.${{ github.run_number }}
      APK_VERSION: Eruditus-v1.0.${{ github.run_number }}.apk
      APK_FIXE: Eruditus.apk
    defaults:
      run:
        working-directory: android-app

    steps:
      # Tout l'historique et les tags : notes depuis la Release précédente.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android-app/gradle/libs.versions.toml
            android-app/**/*.gradle.kts
            server/tests/build.gradle.kts
            android-app/gradle/wrapper/gradle-wrapper.properties

      # D45 : -Pnumero=<n> donne versionCode 1000 + n et versionName 1.0.<n>.
      - name: Numéro de version
        run: echo "VERSION_CODE=$((1000 + NUMERO))" >> "$GITHUB_ENV"

      # Un échec bloque la Release. Adresse factice : le vrai secret ne sert qu'au build signé.
      - name: Tests JVM
        env:
          ERUDITUS_URL: https://serveur.invalid
        run: ./gradlew :app:testDebugUnitTest :release-notes:test --stacktrace

      # Notes (spec/publication.md § 3) : commits qui touchent l'app depuis le tag de la Release
      # précédente. Avant le keystore : une fois ANDROID_KEYSTORE_PATH défini, toute commande
      # Gradle configure la signature et réclame les mots de passe, fournis au seul build.
      - name: Notes de version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          ARGS_LOG=""
          PRECEDENTE="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> /dev/null || true)"
          if [ -n "$PRECEDENTE" ] && [ "$PRECEDENTE" != "$TAG" ] && git rev-parse -q --verify "refs/tags/$PRECEDENTE^{commit}" > /dev/null; then
            git -c core.quotePath=false log --reverse --name-only --format='%x1e%H%x1f%P%x1f%s' \
              "$PRECEDENTE..$GITHUB_SHA" > "$RUNNER_TEMP/commits.log"
            ARGS_LOG="--log $RUNNER_TEMP/commits.log --comparaison $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PRECEDENTE...$TAG"
            echo "Notes depuis $PRECEDENTE"
          else
            echo "::notice::Pas de Release précédente dans l'historique : notes sans liste des changements"
          fi
          if ! ./gradlew -q :release-notes:run \
            --args="--version $VERSION_NAME --code $VERSION_CODE --commit $GITHUB_SHA --sortie $NOTES $ARGS_LOG"; then
            echo "::warning::Notes de version impossibles à calculer : en-tête seul"
            echo "Eruditus $VERSION_NAME (versionCode $VERSION_CODE), commit ${GITHUB_SHA::7}." > "$NOTES"
          fi
          cat "$NOTES"

      # Le keystore n'existe que dans le dossier temporaire du runner, jamais dans le dépôt (D50).
      - name: Décoder le keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Secrets passés à cette seule étape, jamais affichés : un secret absent est nommé, sa valeur
      # jamais écrite ; le build n'écrit pas l'adresse du serveur (D43).
      - name: Build de l'APK release signé
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ERUDITUS_URL: ${{ secrets.ERUDITUS_URL }}
        run: |
          for NOM in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ERUDITUS_URL; do
            if [ -z "${!NOM}" ]; then
              echo "::error::Secret $NOM manquant"
              exit 1
            fi
          done
          ./gradlew :app:assembleRelease -Pnumero="$NUMERO" --stacktrace

      # Dépôt public : la signature est vérifiée sans afficher le certificat. Deux noms pour le même
      # APK : l'un par version, l'autre pour le lien fixe releases/latest/download/Eruditus.apk.
      - name: Vérifier la signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          cp "$APK" "$RUNNER_TEMP/$APK_VERSION"
          cp "$APK" "$RUNNER_TEMP/$APK_FIXE"
          ls -l "$RUNNER_TEMP/$APK_VERSION" "$RUNNER_TEMP/$APK_FIXE"

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Relance d'un même run : les APK de la Release existante sont remplacés, texte inchangé.
            gh release upload "$TAG" "$RUNNER_TEMP/$APK_VERSION" "$RUNNER_TEMP/$APK_FIXE" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Relance d'un ancien run alors qu'une Release plus récente contient déjà son commit :
            # rien à publier, sinon cette version plus ancienne passerait Latest devant elle.
            DERNIERE="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> /dev/null || true)"
            if [ -n "$DERNIERE" ] && git merge-base --is-ancestor "$GITHUB_SHA" "refs/tags/$DERNIERE" 2> /dev/null; then
              echo "::notice::$DERNIERE contient déjà le commit ${GITHUB_SHA::7} : pas de Release $TAG"
              exit 0
            fi
            gh release create "$TAG" "$RUNNER_TEMP/$APK_VERSION" "$RUNNER_TEMP/$APK_FIXE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "Eruditus v$VERSION_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Supprimer le keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
