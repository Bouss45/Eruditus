<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composants et états — B · Glacier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..700&amp;family=Inter:opsz,wght@14..32,400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#7DD0FA}a:hover{color:#B5E4FC}
</style>
</helmet>
<div style="width: 4300px; height: 2800px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px; padding: 56px; background: #1B1B1C; color: #F2F2F2; font-family: 'Inter', system-ui, sans-serif">
  <div style="display: flex; flex-direction: column; gap: 10px; max-width: 1200px">
    <h1 style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Composants et états</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A3A3A3">Chaque composant est rendu par le même composant d’écran que les maquettes (planche « Écran — composant partagé ») : ce que tu vois ici est exactement ce qu’utilisent les écrans. Sombre à gauche, clair à droite.</p>
  </div>
  <div style="display: flex; gap: 64px; align-items: flex-start">
    <sc-for list="{{columns}}" as="col" hint-placeholder-count="4">
      <div style="width: 784px; flex: none; display: flex; flex-direction: column; gap: 48px">
        <sc-for list="{{col.sections}}" as="sec" hint-placeholder-count="3">
          <section style="display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <h2 style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700">{{sec.title}}</h2>
              <p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #A3A3A3; text-wrap: pretty">{{sec.note}}</p>
            </div>
            <sc-for list="{{sec.pairs}}" as="p" hint-placeholder-count="1">
              <div style="display: flex; gap: 20px; align-items: flex-start">
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <sc-if value="{{p.showLabel}}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; font-weight: 600; color: #A3A3A3">Sombre</span></sc-if>
                  <dc-import name="Ecran" screen="{{p.a}}" hint-size="382px,160px"></dc-import>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <sc-if value="{{p.showLabel}}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; font-weight: 600; color: #A3A3A3">Clair</span></sc-if>
                  <dc-import name="Ecran" screen="{{p.b}}" hint-size="382px,160px"></dc-import>
                </div>
              </div>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4300,"height":2800}}'>
var NB = ' ', FN = ' ';
class Component extends DCLogic {
  renderVals() {
    var cap = function (t, first) { return { type: 'caption', text: t, mt: first ? 0 : 8 }; };
    var ch = function (l, t, st) { return { type: 'choice', letter: l, text: t, state: st }; };
    var btn = function (kind, label, st, more) { return { type: 'buttons', items: [Object.assign({ kind: kind, label: label, state: st }, more || {})] }; };
    var pts = function (n) { return NB + (n > 1 ? 'points' : 'point'); };
    var pair = function (blocks, extra, first) {
      var mk = function (th) { return Object.assign({ bare: true, theme: th, blocks: blocks }, extra || {}); };
      return { a: mk('sombre'), b: mk('clair'), showLabel: !!first };
    };
    var one = function (blocks, extra) { return [pair(blocks, extra, true)]; };
    var pw = 'nuit-blanche-42';
    var choix = { title: 'Choix de réponse', note: 'Bouton pleine largeur, 64 dp minimum, le texte passe à la ligne. Bonne réponse choisie et bonne réponse révélée ont le même état final : seul le mouvement diffère (remplissage et rebond, contre fondu). Relecture : l’apparence de Neutre, sans appui, ni pression, ni vibration ; dans le détail d’une partie, Bonne et Mauvaise s’affichent aussi en lecture seule.', pairs: one([
      cap('Neutre', true), ch('A', 'René Magritte', 'neutre'),
      cap('Relecture : lecture seule, sans appui ni pression (détail d’une partie)'), { type: 'choice', ro: true, letter: 'A', text: 'René Magritte', state: 'relecture' },
      cap('Pressé'), ch('A', 'René Magritte', 'presse'),
      cap('Envoi : indicateur dans le choix touché'), ch('A', 'René Magritte', 'envoi'),
      cap('Verrouillé : les autres choix, pendant l’envoi et la correction'), ch('B', 'Max Ernst', 'verrouille'),
      cap('Bonne réponse (choisie)'), ch('C', 'Salvador Dalí', 'bonne'),
      cap('Mauvaise réponse (choisie)'), ch('A', 'René Magritte', 'mauvaise'),
      cap('Bonne réponse révélée'), ch('C', 'Salvador Dalí', 'revelee')
    ]) };
    var chrono = { title: 'Chrono', note: 'Barre et secondes, calés sur restantMs. Accent tant que le temps court, jamais de rouge ; gris dès qu’il s’arrête. TalkBack l’annonce à 10 s et à 5 s.', pairs: one([
      cap('En cours', true), { type: 'chrono', counter: 'Question 2/5', secs: 14, state: 'cours' },
      cap('Fin proche : même couleur'), { type: 'chrono', counter: 'Question 2/5', secs: 5, state: 'cours' },
      cap('Arrêté après la réponse'), { type: 'chrono', counter: 'Question 2/5', secs: 9, state: 'arret' },
      cap('Temps écoulé'), { type: 'chrono', counter: 'Question 2/5', secs: 0, state: 'arret' }
    ]) };
    var resultat = { title: 'Ligne de résultat', note: 'Le verdict seul sur sa ligne, le détail en dessous sur toute la largeur. « La bonne réponse était C. » dès que le joueur s’est trompé ou n’a pas répondu. Puis un bouton neutre : la case verte reste la seule surface mise en avant.', pairs: one([
      cap('gagne', true), { type: 'result', kind: 'gagne', verdict: 'Bonne réponse' + FN + '! +1' + NB + 'point' },
      cap('deja_reussie'), { type: 'result', kind: 'deja', verdict: 'Bonne réponse, déjà réussie' + NB + ': pas de point cette fois.' },
      cap('fausse'), { type: 'result', kind: 'fausse', verdict: 'Mauvaise réponse.', detail: 'La bonne réponse était C.' },
      cap('sans_reponse, hors_delai'), { type: 'result', kind: 'temps', verdict: 'Temps écoulé.', detail: 'La bonne réponse était C.' },
      cap('Puis'), btn('secondaire', 'Question suivante')
    ]) };
    var champ = { title: 'Champ de saisie', note: 'Libellé au-dessus du champ, jamais dedans : il reste lisible à 200 %. L’erreur remplace l’aide, avec une icône. Afficher ou masquer : bouton de 48 dp nommé pour TalkBack. Champs marqués pour le remplissage automatique.', pairs: one([
      cap('Vide, avec aide', true), { type: 'field', label: 'Pseudo', value: '', help: '3 à 20 caractères' + NB + ': lettres, chiffres et _' },
      cap('En saisie'), { type: 'field', label: 'Pseudo', value: 'Hibou_4', focus: true, help: '3 à 20 caractères' + NB + ': lettres, chiffres et _' },
      cap('Erreur'), { type: 'field', label: 'Pseudo', value: 'Hibou_42', error: 'Ce pseudo est déjà pris.' },
      cap('Mot de passe masqué'), { type: 'field', label: 'Mot de passe', value: pw, password: true, help: '8 caractères minimum' },
      cap('Mot de passe affiché'), { type: 'field', label: 'Mot de passe', value: pw, password: true, shown: true, help: '8 caractères minimum' },
      cap('Désactivé pendant un envoi'), { type: 'field', label: 'Pseudo', value: 'Hibou_42', disabled: true }
    ]) };
    var code = { title: 'Code de récupération', note: '4 groupes de 4, en grand, sur 2 lignes à toutes les tailles de texte. Chiffres tabulaires, I et 0 désambiguïsés. TalkBack le lit caractère par caractère. « Copier » le marque comme sensible.', pairs: one([
      cap('Code', true), { type: 'code', groups: ['7K3M', 'Q9XA', '2HDE', 'F8RT'] },
      cap('Copier'), btn('secondaire', 'Copier', 'normal', { copy: true })
    ]) };
    var message = { title: 'Message en haut d’écran', note: 'Monochrome : il informe sans juger. Il s’insère sous la barre du haut (ou en haut du contenu s’il n’y a pas de barre) et pousse le contenu vers le bas : il ne recouvre jamais rien, même à 200 %. Zone annoncée par TalkBack.', pairs: one([], { messages: [
      { text: 'Ta session a expiré, reconnecte-toi.' },
      { text: 'Ton compte a été supprimé.' },
      { icon: 'alerte', text: 'Une erreur est survenue. Réessaie.' }
    ] }) };
    var principal = { title: 'Bouton principal', note: 'Un seul par écran, en bas, à portée du pouce. Pendant un appel : indicateur dans le bouton, le libellé reste, tous les boutons de l’écran sont désactivés.', pairs: one([
      cap('Normal', true), btn('principal', 'Se connecter'),
      cap('Pressé'), btn('principal', 'Se connecter', 'presse'),
      cap('Chargement'), btn('principal', 'Se connecter', 'chargement'),
      cap('Désactivé'), btn('principal', 'Créer mon compte', 'desactive'),
      cap('Grand : Jouer'), btn('principal', 'Jouer', 'normal', { big: true })
    ]) };
    var secondaire = { title: 'Bouton secondaire', note: 'Neutre : contour et texte, sans fond. « Question suivante », « Se connecter » sur Bienvenue, « Accueil », « Annuler ».', pairs: one([
      cap('Normal', true), btn('secondaire', 'Question suivante'),
      cap('Pressé'), btn('secondaire', 'Question suivante', 'presse'),
      cap('Chargement'), btn('secondaire', 'Question suivante', 'chargement'),
      cap('Désactivé'), btn('secondaire', 'Accueil', 'desactive'),
      cap('Petit, 48 dp : en retrait sur l’Accueil'), { type: 'buttons', dir: 'row', items: [{ kind: 'secondaire', size: 's', label: 'Classement' }, { kind: 'secondaire', size: 's', label: 'Compte' }] }
    ]) };
    var destructeur = { title: 'Bouton destructeur et lien', note: 'Destructeur : fond rouge-conteneur et contour rouge, pour ce qui efface ou interrompt (supprimer, abandonner). Lien : texte accent, cible de 48 dp.', pairs: one([
      cap('Normal', true), btn('destructeur', 'Supprimer mon compte'),
      cap('Pressé'), btn('destructeur', 'Supprimer mon compte', 'presse'),
      cap('Chargement'), btn('destructeur', 'Supprimer définitivement', 'chargement'),
      cap('Désactivé (mot de passe pas encore saisi)'), btn('destructeur', 'Supprimer définitivement', 'desactive'),
      cap('Lien'), { type: 'link', text: 'Mot de passe oublié' + FN + '?' }
    ]) };
    var classement = { title: 'Ligne de classement', note: 'Rang, pseudo (jusqu’à 20 caractères, retour à la ligne plutôt que coupure), points. Ma ligne : fond accent-teinte et « Toi ». Pied : nombre de joueurs classés.', pairs: one([
      cap('Lignes du top 10', true), { type: 'list', head: ['Top 10', 'Points'], rows: [{ rank: '1er', pseudo: 'Hypatie', n: '19', unit: pts(19) }, { rank: '2e', pseudo: 'LeBaronPerche', n: '15', unit: pts(15) }, { rank: '4e', pseudo: 'MarieCurieDuDimanche', n: '11', unit: pts(11) }] },
      cap('Ma ligne dans le top 10'), { type: 'list', rows: [{ rank: '3e', pseudo: 'Hibou_42', n: '12', unit: pts(12), me: true }] },
      cap('Ma ligne sous le top 10'), { type: 'sep' }, { type: 'list', tint: true, aria: 'Ton rang', rows: [{ rank: '27e', pseudo: 'Hibou_42', n: '4', unit: pts(4), me: true }] },
      cap('Pas encore classé'), { type: 'notice', text: 'Réussis une question pour entrer au classement.' },
      cap('Sous la liste'), { type: 'text', size: 'small', tone: 'muted', align: 'center', text: '48 joueurs classés' }
    ]) };
    var dlg = function (c, d) { return pair([cap(c, true)], { dialog: d }, false); };
    var boites = { title: 'Boîte de confirmation', note: 'Titre en question, texte en dessous, deux actions côte à côte qui passent l’une sous l’autre quand le texte grandit. L’action sûre à gauche.', pairs: [
      Object.assign(dlg('Code de récupération, retour système', { title: 'As-tu bien noté ton code' + FN + '?', text: 'Il ne sera plus jamais affiché.', actions: [{ kind: 'secondaire', label: 'Pas encore' }, { kind: 'principal', label: 'Oui' }] }), { showLabel: true }),
      dlg('Partie, fermer ou retour système', { title: 'Abandonner la partie' + FN + '?', text: 'Les réponses déjà données comptent.', actions: [{ kind: 'secondaire', label: 'Continuer' }, { kind: 'destructeur', label: 'Abandonner' }] }),
      dlg('Compte, se déconnecter', { title: 'Se déconnecter de tous tes appareils' + FN + '?', actions: [{ kind: 'secondaire', label: 'Annuler' }, { kind: 'principal', label: 'Se déconnecter' }] })
    ] };
    var delText = 'Ton compte, tes parties et ton score seront effacés définitivement. Ton pseudo deviendra libre.';
    var suppression = { title: 'Boîte de suppression du compte', note: 'Avec le champ Mot de passe. « Supprimer définitivement » ne s’active qu’une fois le mot de passe saisi. En cas d’erreur réseau, rien n’est effacé.', pairs: [
      Object.assign(dlg('Vide', { text: delText, field: { label: 'Mot de passe', value: '', password: true, ac: 'current-password' }, actions: [{ kind: 'secondaire', label: 'Annuler' }, { kind: 'destructeur', label: 'Supprimer définitivement', state: 'desactive' }] }), { showLabel: true }),
      dlg('Erreur', { text: delText, field: { label: 'Mot de passe', value: 'nuit-blanche', password: true, error: 'Mot de passe incorrect.' }, actions: [{ kind: 'secondaire', label: 'Annuler' }, { kind: 'destructeur', label: 'Supprimer définitivement' }] }),
      dlg('Envoi', { text: delText, field: { label: 'Mot de passe', value: pw, password: true, disabled: true }, actions: [{ kind: 'secondaire', label: 'Annuler', state: 'desactive' }, { kind: 'destructeur', label: 'Supprimer définitivement', state: 'chargement' }] })
    ] };
    var cumul = function (d, vs) { var e = d, p = []; vs.forEach(function (v) { e = Math.max(100, e + v); p.push(e); }); return p; };
    var seed = 7, rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    var V70 = []; for (var i = 0; i < 70; i++) { var v = Math.round(rnd() * 44 - 19); if (rnd() < 0.08) v = 0; V70.push(v); }
    var d50 = 1000; for (var j = 0; j < 20; j++) d50 += V70[j];
    var courbe = { title: 'CourbeElo', note: 'Nouveau composant. 120 de haut à toutes les tailles, dans les marges de 16. Ligne de 2 en texte, sans remplissage ; grille en piste (plus haut, milieu, plus bas) ; valeurs extrêmes en petit texte-secondaire à gauche ; repère de départ creux ; points de 6, le dernier de 8 en accent. Moins de 12 entre deux points : seul le dernier est marqué. Jamais de vert ni de rouge. Ignorée par TalkBack : le résumé dessous est lu.', pairs: one([
      cap('Normal', true), { type: 'courbe', depart: 1000, points: cumul(1000, [12, -9, -16, 11, 12, 0, 16, 14, 21, -8, -6, -4]) },
      cap('Un point : le départ et la partie'), { type: 'courbe', depart: 1000, points: [1014] },
      cap('Provisoire : tracé en tirets'), { type: 'courbe', depart: 1000, points: cumul(1000, [38, -19, 42, -14]), provisoire: true },
      cap('50 points'), { type: 'courbe', depart: d50, points: cumul(d50, V70.slice(20)) }
    ]) };
    var A = function (label, sub, value, extra) { return Object.assign({ label: label, sub: sub, value: value, aria: [label, sub, value].filter(function (x) { return x; }).join(', ') }, extra || {}); };
    var ligneAction = { title: 'LigneAction', note: 'Mise à jour : variante « avec valeur » (Historique). La valeur, corps 600 tabulaire en texte, est à droite ; elle passe sous le libellé quand elle ne tient pas à côté. Toute la ligne est la cible ; TalkBack lit le libellé, puis la valeur.', pairs: one([
      cap('Normal, pressé, destructrice', true), { type: 'actions', rows: [A('Changer de pseudo'), A('Envoyer un avis', '', '', { pressed: true }), A('Supprimer mon compte', '', '', { destructive: true })] },
      cap('Avec valeur'), { type: 'actions', head: 'Mes parties', rows: [A('22 nov. 2026', '3 bonnes réponses sur 5', '+14'), A('21 nov. 2026', '2 bonnes réponses sur 5', '−8'), A('18 nov. 2026', '3 bonnes réponses sur 5', '0'), A('22 nov. 2026', '2 bonnes réponses sur 3 questions · Abandonnée', '−6')] },
      cap('Avec valeur trop longue : dessous'), { type: 'actions', rows: [A('21 nov. 2026', '4 bonnes réponses sur 5', 'Sans effet sur l’Elo')] }
    ]) };
    return { columns: [
      { sections: [choix, chrono, resultat] },
      { sections: [champ, code, message] },
      { sections: [principal, secondaire, destructeur, classement] },
      { sections: [boites, suppression] },
      { sections: [courbe, ligneAction] }
    ] };
  }
}
</script>
</body>
</html>
