<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Elo · Classement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..700&amp;family=Inter:opsz,wght@14..32,400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#1364B0}a:hover{color:#0D4A85}
</style>
</helmet>
<div style="width: 2220px; height: 3900px; display: flex; flex-direction: column; background: #E6E5E2; font-family: 'Inter', system-ui, sans-serif">
  <header style="display: flex; flex-direction: column; gap: 10px; padding: 48px 48px 0; background: #1B1B1C; color: #F2F2F2">
    <h1 style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Classement · Elo</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A3A3A3; max-width: 1400px">Même gabarit Liste : en-tête « Top 10 » et « Elo », l’Elo seul sans unité dans LigneClassement, ma ligne marquée « Toi », pied sous la liste. Provisoire : l’Encadre sous le top 10, à la place de ma ligne.</p>
  </header>
  <sc-for list="{{bands}}" as="band" hint-placeholder-count="3">
    <section style="display: flex; flex-direction: column; gap: 24px; padding: {{band.pad}}; background: {{band.bg}}; flex-grow: {{band.grow}}">
      <div style="display: flex; align-items: baseline; gap: 12px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: {{band.fg}}">{{band.label}}</h2>
        <span style="font-size: 15px; color: {{band.muted}}">{{band.sub}}</span>
      </div>
      <div style="display: flex; gap: 40px; align-items: flex-start">
        <sc-for list="{{band.items}}" as="it" hint-placeholder-count="5">
          <figure style="margin: 0; width: 390px; flex: none; display: flex; flex-direction: column; gap: 12px">
            <figcaption style="min-height: 38px; font-size: 14px; line-height: 1.35; font-weight: 600; color: {{it.cap}}">{{it.caption}}</figcaption>
            <dc-import name="Ecran" screen="{{it.s}}" hint-size="390px,844px"></dc-import>
          </figure>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2220,"height":3900}}'>
var NB = ' ', FN = ' ';
class Component extends DCLogic {
  renderVals() {
    var ord = function (n) { return n === 1 ? '1er' : n + 'e'; };
    var R = function (n, pseudo, elo, me) { return { rank: ord(n), pseudo: pseudo, n: String(elo), unit: '', me: !!me }; };
    var inTop = [R(1, 'Hypatie', 2140), R(2, 'LeBaronPerche', 1532), R(3, 'Hibou_42', 1247, true), R(4, 'MarieCurieDuDimanche', 1236), R(5, 'Albatros', 1198), R(6, 'tartine42', 1175), R(7, 'Vercingetorix', 1150), R(8, 'Zoe_L', 1121), R(9, 'Quiz_Kid', 1096), R(10, 'Penelope', 1072)];
    var outTop = [R(1, 'Hypatie', 2140), R(2, 'LeBaronPerche', 1980), R(3, 'MarieCurieDuDimanche', 1874), R(4, 'Albatros', 1702), R(5, 'tartine42', 1611), R(6, 'Vercingetorix', 1540), R(7, 'Zoe_L', 1466), R(8, 'Quiz_Kid', 1398), R(9, 'Penelope', 1355), R(10, 'LaChouette', 1310)];
    var tie = [R(1, 'Hypatie', 2140), R(2, 'Hibou_42', 1980, true), R(2, 'LeBaronPerche', 1980), R(4, 'MarieCurieDuDimanche', 1874), R(5, 'Albatros', 1702), R(6, 'tartine42', 1611), R(7, 'Vercingetorix', 1540), R(8, 'Zoe_L', 1466), R(9, 'Quiz_Kid', 1398), R(10, 'Penelope', 1355)];
    var head = ['Top 10', 'Elo'];
    var foot = { type: 'text', size: 'small', tone: 'muted', align: 'center', text: '48 joueurs classés', mt: 4 };
    var PROV = 'Elo provisoire' + NB + ': encore 12 réponses avant d’entrer au classement.';
    var ecran = function (blocks, o) { o = o || {}; return { bar: { nav: 'retour', title: 'Classement' }, blocks: blocks, scale: o.scale || 1, tall: !!o.tall }; };
    var hors = function (o) { return ecran([{ type: 'list', head: head, rows: outTop }, { type: 'sep' }, { type: 'list', tint: true, aria: 'Ton rang', rows: [R(27, 'Hibou_42', 1180, true)] }, foot], o); };
    var prov = function (o) { return ecran([{ type: 'list', head: head, rows: outTop }, { type: 'notice', text: PROV }, foot], o); };
    var defs = [
      { caption: 'Toi dans le top 10', s: ecran([{ type: 'list', head: head, rows: inTop }, foot]) },
      { caption: 'Toi hors du top 10', s: hors() },
      { caption: 'Provisoire : l’Encadre sous le top 10', s: prov() },
      { caption: 'Ex æquo : 2e, 2e, 4e (toi parmi eux)', s: ecran([{ type: 'list', head: head, rows: tie }, foot]) },
      { caption: 'Personne n’est encore classé', s: ecran([{ type: 'spacer' }, { type: 'text', align: 'center', weight: 500, text: 'Personne n’est encore classé. Lance une partie' + FN + '!' }, { type: 'spacer' }]) }
    ];
    var mk = function (b) { return Object.assign(b, { items: defs.map(function (d) { return { caption: d.caption, cap: b.muted, s: Object.assign({}, d.s, { theme: b.th }) }; }) }); };
    var bands = [
      mk({ label: 'Sombre', sub: 'thème par défaut', th: 'sombre', bg: '#1B1B1C', fg: '#F2F2F2', muted: '#A3A3A3', pad: '32px 48px 48px', grow: '0' }),
      mk({ label: 'Clair', sub: 'Paramètres › Apparence, ou le téléphone', th: 'clair', bg: '#E6E5E2', fg: '#1B1B1C', muted: '#57575A', pad: '32px 48px 48px', grow: '0' }),
      { label: 'Texte à 200 %', sub: 'pire cas : provisoire (Encadre de 4 lignes) ; l’Elo passe sous le pseudo quand ils ne tiennent pas côte à côte', bg: '#2A2A2C', fg: '#F2F2F2', muted: '#B0B0B0', pad: '32px 48px 48px', grow: '1', items: [
        { caption: 'Provisoire · 200 %, sombre', cap: '#B0B0B0', s: Object.assign(prov({ scale: 2, tall: true }), { theme: 'sombre' }) },
        { caption: 'Toi hors du top 10 · 200 %, clair', cap: '#B0B0B0', s: Object.assign(hors({ scale: 2, tall: true }), { theme: 'clair' }) }
      ] }
    ];
    return { bands: bands };
  }
}
</script>
</body>
</html>
