<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Icône de l’app — 3 pistes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#7DD0FA}a:hover{color:#B5E4FC}
</style>
</helmet>
<div style="width: 2400px; height: 1500px; box-sizing: border-box; display: flex; flex-direction: column; gap: 48px; padding: 56px; background: #1B1B1C; color: #F2F2F2; font-family: 'Inter', system-ui, sans-serif">
  <div style="display: flex; flex-direction: column; gap: 10px; max-width: 1100px">
    <h1 style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Icône de l’app — 3 pistes</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A3A3A3">Icône adaptative Android : calque de 108 dp, zone sûre de 66 dp, recadrée par chaque lanceur. Chaque piste a sa couche monochrome pour les icônes à thème (Android 13 et plus). L’écran de Démarrage reprendra l’icône retenue.</p>
  </div>
  <sc-for list="{{pistes}}" as="p" hint-placeholder-count="3">
    <section style="display: flex; gap: 48px; align-items: flex-start; padding-bottom: 40px; border-bottom: 1px solid #2E2E30">
      <div style="width: 300px; flex: none; display: flex; flex-direction: column; gap: 8px; padding-top: 8px">
        <h2 style="margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700">{{p.name}}</h2>
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #BDBDBD; text-wrap: pretty">{{p.desc}}</p>
      </div>
      <div style="display: flex; gap: 40px; align-items: flex-end; flex-wrap: wrap">
        <sc-for list="{{p.cells}}" as="c" hint-placeholder-count="8">
          <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: {{c.boxW}}px; height: {{c.boxH}}px; border-radius: 20px; background: {{c.wall}}">
              <svg width="{{c.size}}" height="{{c.size}}" viewBox="{{c.vb}}" role="img" aria-label="{{c.aria}}">
                <sc-if value="{{c.mFull}}" hint-placeholder-val="{{ false }}">
                  <rect x="0" y="0" width="108" height="108" fill="{{c.bg}}"></rect>
                  <rect x="18" y="18" width="72" height="72" fill="none" stroke="{{c.guide}}" stroke-width="0.5"></rect>
                  <circle cx="54" cy="54" r="33" fill="none" stroke="{{c.guide}}" stroke-width="0.6" stroke-dasharray="2 2"></circle>
                </sc-if>
                <sc-if value="{{c.mCircle}}" hint-placeholder-val="{{ false }}"><circle cx="54" cy="54" r="36" fill="{{c.bg}}"></circle></sc-if>
                <sc-if value="{{c.mSquircle}}" hint-placeholder-val="{{ false }}"><path d="M54 18C79.3 18 90 28.7 90 54S79.3 90 54 90 18 79.3 18 54 28.7 18 54 18Z" fill="{{c.bg}}"></path></sc-if>
                <sc-if value="{{c.mRound}}" hint-placeholder-val="{{ false }}"><rect x="18" y="18" width="72" height="72" rx="17" fill="{{c.bg}}"></rect></sc-if>
                <sc-if value="{{c.p1}}" hint-placeholder-val="{{ false }}">
                  <path d="M40 41c0-8.3 6.3-14 14.2-14C62.3 27 68 32.4 68 39.6c0 6-3.6 8.9-8 11.8-3.8 2.5-5.9 4.6-5.9 9.1v3.5" fill="none" stroke="{{c.fg}}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
                  <circle cx="54" cy="78" r="5.5" fill="{{c.accent}}"></circle>
                </sc-if>
                <sc-if value="{{c.p2}}" hint-placeholder-val="{{ false }}">
                  <rect x="31" y="32" width="46" height="9" rx="4.5" fill="{{c.fg}}" fill-opacity="0.32"></rect>
                  <rect x="31" y="46" width="46" height="9" rx="4.5" fill="{{c.fg}}" fill-opacity="0.32"></rect>
                  <rect x="31" y="60" width="46" height="9" rx="4.5" fill="{{c.accent}}"></rect>
                  <rect x="31" y="74" width="46" height="9" rx="4.5" fill="{{c.fg}}" fill-opacity="0.32"></rect>
                </sc-if>
                <sc-if value="{{c.p3}}" hint-placeholder-val="{{ false }}">
                  <rect x="34" y="30" width="10" height="48" rx="2.5" fill="{{c.fg}}"></rect>
                  <rect x="34" y="30" width="40" height="9" rx="2.5" fill="{{c.fg}}"></rect>
                  <rect x="34" y="69" width="40" height="9" rx="2.5" fill="{{c.fg}}"></rect>
                  <path d="M44 49.5H67.5A2.5 2.5 0 0 1 70 52V56A2.5 2.5 0 0 1 67.5 58.5H44Z" fill="{{c.fg}}" fill-opacity="0.3"></path>
                  <path d="M44 49.5H58.5A2.5 2.5 0 0 1 61 52V56A2.5 2.5 0 0 1 58.5 58.5H44Z" fill="{{c.accent}}"></path>
                </sc-if>
              </svg>
              <sc-if value="{{c.hasLabel}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; line-height: 1.2; color: {{c.labelFg}}">Eruditus</span></sc-if>
            </div>
            <figcaption style="font-size: 13px; line-height: 1.35; color: #A3A3A3; text-align: center">{{c.caption}}</figcaption>
          </figure>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2400,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    var N = { bg: '#080A0C', fg: '#E7ECF0', accent: '#7DD0FA' };
    var MC = { bg: '#D7E3EE', fg: '#1D3447', accent: '#1D3447' };
    var MS = { bg: '#1D3447', fg: '#CFE1F0', accent: '#CFE1F0' };
    var specs = [
      { caption: 'Grille 108 dp · zone sûre 66 dp', mask: 'full', size: 216, col: N, wall: 'transparent', box: 216 },
      { caption: 'Cercle', mask: 'circle', size: 120, col: N, wall: 'transparent', box: 120 },
      { caption: 'Squircle', mask: 'squircle', size: 120, col: N, wall: 'transparent', box: 120 },
      { caption: 'Carré arrondi', mask: 'round', size: 120, col: N, wall: 'transparent', box: 120 },
      { caption: 'Fond d’écran sombre · 48 dp', mask: 'circle', size: 48, col: N, wall: '#26313C', box: 150, label: '#F2F2F2' },
      { caption: 'Fond d’écran clair · 48 dp', mask: 'circle', size: 48, col: N, wall: '#C9D6E2', box: 150, label: '#1B1B1C' },
      { caption: 'Icône à thème · clair', mask: 'circle', size: 96, col: MC, wall: '#EEF2F5', box: 150 },
      { caption: 'Icône à thème · sombre', mask: 'circle', size: 96, col: MS, wall: '#11181E', box: 150 }
    ];
    var mk = function (id, name) {
      return specs.map(function (s) {
        return { caption: s.caption, size: s.size, vb: s.mask === 'full' ? '0 0 108 108' : '18 18 72 72', bg: s.col.bg, fg: s.col.fg, accent: s.col.accent, guide: 'rgba(125,208,250,0.55)',
          mFull: s.mask === 'full', mCircle: s.mask === 'circle', mSquircle: s.mask === 'squircle', mRound: s.mask === 'round',
          p1: id === 1, p2: id === 2, p3: id === 3, aria: name + ', ' + s.caption,
          wall: s.wall, boxW: s.box, boxH: s.label ? 130 : s.box, hasLabel: !!s.label, labelFg: s.label || '#F2F2F2' };
      });
    };
    return { pistes: [
      { name: 'Piste 1 · Le point', desc: 'Un point d’interrogation tracé d’un seul trait ; son point est la seule lumière, comme l’accent dans l’app. Le plus lisible en petit.', cells: mk(1, 'Piste 1') },
      { name: 'Piste 2 · Les quatre choix', desc: 'Quatre barres, une seule allumée : la bonne réponse, comme dans une partie. Abstrait, propre à Eruditus, mais moins parlant hors contexte.', cells: mk(2, 'Piste 2') },
      { name: 'Piste 3 · Le E chronométré (retenue)', desc: 'Le E d’Eruditus ; sa barre du milieu est le chrono, aux deux tiers. Porte le nom, mais un E géométrique est plus courant.', cells: mk(3, 'Piste 3') }
    ] };
  }
}
</script>
</body>
</html>
